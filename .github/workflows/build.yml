name: Build & Test

# Manual only (2026-10-06, the user's call): a push or a pull request to main runs nothing, and a v* tag runs release.yml,
# which is this same pipeline before it publishes the release. Run this one from the Actions tab (Build & Test, Run workflow)
# for a CI check without a release, on any branch.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    name: Build, Test, Publish, Smoke, Package
    # A cold restore, build, coverage run and NativeAOT publish is 20-30 minutes on a hosted
    # runner; anything past this is a hang, not a slow run, and GitHub's default is six hours.
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      # build.ps1 is the single definition of the pipeline: restore, build with a zero-warning
      # budget, test with -c Release (load-bearing next to --no-build) and coverage, NativeAOT
      # publish with a zero-own-warning budget, run the PUBLISHED exe with --smoke, then stage
      # the release zip so packaging is exercised on every run, not only on a tag. Anything CI
      # does that the script does not is a difference nobody can reproduce locally.
      - name: Build, test, publish, smoke, package
        shell: pwsh
        run: ./build.ps1 -Package
        env:
          DOTNET_NOLOGO: 1
          DOTNET_CLI_TELEMETRY_OPTOUT: 1
          # The live-model tests are a local gate, never CI's: a dead URL makes them skip outright
          # instead of scanning the runner's ports, where anything that answers (even a 401) would run them.
          NEONSIDEKICK_TEST_LLM_URL: http://127.0.0.1:9/v1

      - name: Upload package
        uses: actions/upload-artifact@v7
        with:
          name: NeonSidekick-win-x64
          path: |
            publish/package/*.zip
            publish/package/*.sha256
          retention-days: 7
          if-no-files-found: error

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: publish/coverage/**/coverage.cobertura.xml
          retention-days: 7
          if-no-files-found: ignore

      # --blame-hang (build.ps1) writes Sequence_*.xml (the tests run, last one the culprit) and a
      # process dump beside the coverage output when a test stops making progress.
      - name: Upload hang diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: hang-diagnostics
          path: |
            publish/coverage/**/Sequence_*.xml
            publish/coverage/**/*.dmp
          retention-days: 7
          if-no-files-found: ignore

      - name: List publish output
        if: always()
        shell: pwsh
        run: Get-ChildItem -Path publish/output -Recurse | Select-Object FullName, Length
