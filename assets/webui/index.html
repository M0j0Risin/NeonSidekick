<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NeonSidekick</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/app.css">
<link rel="stylesheet" href="/theme.css" id="theme-css">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<script src="/common.js" defer></script>
<script src="/chat.js" defer></script>
</head>
<body data-tab="chat">
<header class="top">
  <div class="who"><span id="profile">NeonSidekick</span><span class="model" id="model"></span></div>
  <nav><a href="/" class="here">Chat</a><div class="tab-menu"><button type="button" class="tab-menu-button" aria-haspopup="menu" aria-expanded="false" aria-controls="tab-menu-list">☰</button><div class="tab-menu-list hidden" role="menu" id="tab-menu-list"><a href="/home" role="menuitem">🏠 Home</a><a href="/shopping" role="menuitem">🛒 Shopping</a><a href="/youtube" role="menuitem" class="hidden">▶️ YouTube</a></div></div></nav>
  <span class="dot" id="dot" title="connection"></span>
</header>
<main>
  <div id="log" aria-live="polite"></div>
</main>
<div class="floaters top" id="floaters-top">
  <button type="button" class="float hidden" id="expand-all" aria-pressed="false">↕</button>
  <button type="button" class="float hidden" id="to-top">⤒</button>
</div>
<div class="floaters bottom" id="floaters-bottom">
  <button type="button" class="float hidden" id="strip-button">🎞️<span class="new-dot hidden" id="strip-new"></span></button>
  <button type="button" class="float hidden" id="to-bottom">⤓</button>
</div>
<footer class="bottom">
  <div class="inner">
    <div id="asks"></div>
    <section class="ask usage-card hidden" id="usage-card" role="dialog" aria-labelledby="usage-title">
      <h2 id="usage-title"></h2>
      <div class="usage-context" id="usage-context"></div>
      <div class="usage-empty hidden" id="usage-empty"></div>
      <div class="usage-tiles" id="usage-tiles"></div>
      <div class="choices"><button type="button" id="usage-close"></button></div>
    </section>
    <div class="banner waiting hidden" id="waiting"></div>
    <div class="banner queue-held hidden" id="queue-held"><span class="queue-held-text"></span><button type="button" class="queue-resume" id="queue-resume"></button></div>
    <div class="queued hidden" id="queued"></div>
    <div class="banner message hidden" id="message"></div>
    <div class="complete hidden" id="complete" role="listbox"></div>
    <section class="prompts hidden" id="prompts" role="region">
      <div class="strip-bar sheet-bar">
        <div class="sheet-tabs" role="tablist">
          <button type="button" class="sheet-tab" role="tab" data-tab="prompts"><span class="tab-glyph">📣</span><span class="tab-word">Prompts</span></button>
          <button type="button" class="sheet-tab" role="tab" data-tab="memory"><span class="tab-glyph">💾</span><span class="tab-word">Memory</span></button>
          <button type="button" class="sheet-tab" role="tab" data-tab="history"><span class="tab-glyph">🕘</span><span class="tab-word">History</span></button>
        </div>
        <button type="button" class="sheet-action" id="prompts-action"></button>
        <button type="button" id="prompts-close">✕</button>
      </div>
      <div class="prompts-note hidden" id="prompts-note"></div>
      <input type="search" id="prompts-filter" class="hidden" autocomplete="off">
      <div class="prompts-list" id="prompts-list"></div>
    </section>
    <section class="strip hidden" id="strip" role="region" aria-labelledby="strip-head">
      <div class="strip-bar"><span id="strip-head"></span><button type="button" id="strip-close">✕</button></div>
      <div class="strip-row" id="strip-row"></div>
    </section>
    <div class="status hidden" id="status">
      <button type="button" class="learn-button hidden" id="learn">🧠</button>
      <span class="spin hidden" role="status" aria-live="polite"><span class="frame" aria-hidden="true"></span><span class="label"></span><span class="clock" aria-hidden="true"></span></span>
      <button type="button" class="usage hidden" id="usage"></button>
    </div>
    <div class="compose">
      <button type="button" class="prompts-button" id="prompts-button">📣</button>
      <div class="draft-box">
        <textarea id="draft" rows="1" placeholder="Message…" enterkeyhint="send"></textarea>
        <button type="button" class="clear-draft hidden" id="clear-draft">✕</button>
      </div>
      <button class="primary" id="send" title="Send">➤</button>
      <button class="stop hidden" id="stop" title="Stop">■</button>
    </div>
  </div>
</footer>
<div class="overlay hidden" id="overlay" role="dialog" aria-modal="true">
  <div class="overlay-bar">
    <span class="overlay-live hidden" id="overlay-live"></span>
    <span class="overlay-name" id="overlay-name" aria-live="polite"></span>
    <a id="overlay-open" target="_blank" rel="noopener noreferrer"></a>
    <button type="button" class="overlay-delete hidden" id="overlay-delete" title="Delete" aria-label="Delete">🗑️</button>
    <button type="button" id="overlay-close" title="Close">✕</button>
  </div>
  <div class="overlay-note hidden" id="overlay-note" role="status" aria-live="polite"></div>
  <img id="overlay-img" alt="">
  <button type="button" class="overlay-step prev" id="overlay-prev" title="Newer">‹</button>
  <button type="button" class="overlay-step next" id="overlay-next" title="Older">›</button>
</div>
</body>
</html>
