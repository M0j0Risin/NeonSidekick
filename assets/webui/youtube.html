<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>YouTube · NeonSidekick</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/app.css">
<link rel="stylesheet" href="/theme.css" id="theme-css">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<script src="/common.js" defer></script>
<script src="/youtube-core.js" defer></script>
<script src="/youtube.js" defer></script>
</head>
<body data-tab="youtube">
<header class="top">
  <div class="who"><span id="profile">YouTube</span></div>
  <nav><a href="/" id="chat-link">Chat</a><a href="/home">Home</a><a href="/shopping">Shopping</a><a href="/youtube" class="here hidden">YouTube</a></nav>
  <span class="dot" id="dot" title="connection"></span>
</header>
<main class="youtube">
  <!-- The hints sit above the player, never over it: a phone starts a video only on a tap on the video itself (2026-10-16). -->
  <div class="yt-strip">
    <p class="yt-hint" id="hint" aria-live="polite"></p>
    <button type="button" class="hidden" id="play-here"></button>
    <button type="button" class="primary hidden" id="resume"></button>
  </div>
  <div class="yt-frame"><div id="player"></div></div>
  <div class="banner message hidden" id="message"></div>
  <!-- The saved videos (later on 2026-10-16, the user's ask: /youtube list under the player). -->
  <section class="yt-saved hidden" id="saved" aria-labelledby="saved-caption">
    <div class="yt-saved-head">
      <h2 class="yt-caption" id="saved-caption"></h2>
      <button type="button" class="yt-save hidden" id="saved-save"></button>
      <button type="button" class="yt-clear hidden" id="saved-clear"></button>
    </div>
    <input type="search" class="yt-filter hidden" id="saved-filter" autocomplete="off" enterkeyhint="search">
    <p class="yt-note hidden" id="saved-note"></p>
    <ul class="yt-list" id="saved-list"></ul>
  </section>
</main>
</body>
</html>
