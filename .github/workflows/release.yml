name: Release

# A plain semver tag (v0.2.0) builds, tests, publishes, smokes and packages through build.ps1,
# then creates the GitHub release with the zip and its sha256. The tag must equal the csproj
# <Version>; build.ps1 -Tag refuses anything else, so a mistyped tag fails here rather than
# shipping a binary that reports a different version.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    name: Build, Test, Publish, Smoke, Package, Release
    # A cold restore, build, coverage run and NativeAOT publish is 20-30 minutes on a hosted
    # runner; anything past this is a hang, not a slow run, and GitHub's default is six hours.
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Build, test, publish, smoke, package
        shell: pwsh
        run: ./build.ps1 -Package -Tag $env:GITHUB_REF_NAME
        env:
          DOTNET_NOLOGO: 1
          DOTNET_CLI_TELEMETRY_OPTOUT: 1
          # The live-model tests are a local gate, never CI's: a dead URL makes them skip outright
          # instead of scanning the runner's ports, where anything that answers (even a 401) would run them.
          NEONSIDEKICK_TEST_LLM_URL: http://127.0.0.1:9/v1

      # --blame-hang (build.ps1) writes Sequence_*.xml (the tests run, last one the culprit) and a
      # process dump beside the coverage output when a test stops making progress.
      - name: Upload hang diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: hang-diagnostics
          path: |
            publish/coverage/**/Sequence_*.xml
            publish/coverage/**/*.dmp
          retention-days: 7
          if-no-files-found: ignore

      - name: Create GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $zip = Get-ChildItem -Path publish/package -Filter "*.zip" | Select-Object -First 1
          if (-not $zip) { throw "No zip under publish/package." }
          $sha = "$($zip.FullName).sha256"
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Release $tag already exists; skipping."
            exit 0
          }
          gh release create $tag --verify-tag --generate-notes --title "NeonSidekick $tag" $zip.FullName $sha
          if ($LASTEXITCODE -ne 0) { throw "gh release create failed." }
